name: Build bond yield monitor

on:
  schedule:
    # Weekdays. The 06:40 window catches the BoE GLC current-month file
    # (published ~08:00 London) from the prior session; the 16:40 one picks up
    # the Bundesbank same-day curve before the US close.
    #
    # The intermediate windows are deliberate redundancy, not extra coverage.
    # GitHub's scheduler is best-effort: firings are delayed under load and
    # dropped outright when the delay runs long. Through late August 2026 the
    # delay grew from ~30 minutes to 8+ hours, whole firings went missing, and
    # the page sat three days stale under a green tick. A build is ~40s and the
    # deploy is idempotent, so a dropped firing simply gets picked up by the
    # next one rather than waiting half a day.
    - cron: "40 6 * * 1-5"
    - cron: "40 8 * * 1-5"
    - cron: "40 11 * * 1-5"
    - cron: "40 14 * * 1-5"
    - cron: "40 16 * * 1-5"
    - cron: "40 19 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      commentary: ${{ steps.commentary.outputs.status }}
    env:
      UK_BASIS: spot          # BoE IADB par endpoint blocks datacentre IPs
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install openpyxl

      - name: Week stamp for the GLC archive cache
        run: echo "GLC_WEEK=$(date -u +%G-W%V)" >> "$GITHUB_ENV"

      # Cache the 39MB BoE GLC archive for a week, and no longer.
      #
      # The UK curve is archive + current-month file. On the 1st the
      # current-month file rolls over, and the tail of the month it just left
      # only exists in the archive — so an archive pinned to weeks earlier
      # silently drops the end of the previous month, taking the 1m and 3m
      # lookbacks with it. The old key was the run id with a `glc-archive-`
      # restore prefix, which always restored the first copy ever fetched;
      # fetch_rates only re-downloads when the file is 7+ days old by mtime, and
      # the cache round-trip refreshes that, so the expiry never fired.
      #
      # Keying on the ISO week with no restore-keys makes the first run of each
      # week a deliberate miss, which is what forces the fresh download.
      - uses: actions/cache@v4
        with:
          path: glcnominalddata.zip
          key: glc-archive-${{ env.GLC_WEEK }}

      - name: Fetch curves
        run: python3 fetch_rates.py
        # exits non-zero if any market drops out, so a broken build fails loudly
        # rather than publishing a page with a market silently missing

      - name: Write and reconcile commentary
        id: commentary
        run: python3 write_commentary.py
        # publishes a step output: published | partial | suppressed

      - name: Build page
        run: python3 build_dashboard.py

      - name: Sanity-check the output
        run: |
          python3 - <<'PY'
          import json, sys, datetime as dt
          d = json.load(open("rates.json"))
          codes = {m["code"] for m in d["markets"]}
          missing = {"US", "UK", "DE", "JP"} - codes
          assert not missing, f"markets missing: {missing}"
          today = dt.date.today()
          for m in d["markets"]:
              lag = (today - dt.date.fromisoformat(m["asof"])).days
              assert lag <= 5, f"{m['code']} stale: as at {m['asof']}"
              # A hole in the middle of a series shortens every lookback across
              # it without changing anything visible. Holidays make gaps of a
              # few days — Christmas and Easter run to about five — so only a
              # far larger one means data has actually gone missing.
              ds = [dt.date.fromisoformat(x) for x in m["dates"][-90:]]
              gaps = [((b - a).days, a, b) for a, b in zip(ds, ds[1:])]
              worst = max(gaps) if gaps else (0, None, None)
              assert worst[0] <= 10, (
                  f"{m['code']} has a {worst[0]}-day hole between "
                  f"{worst[1]} and {worst[2]}")
          errs = d.get("context_errors") or []
          for e in errs:
              print(f"context series unavailable: {e['series']} — {e['detail']}")
          cm = d.get("commentary") or {}
          if cm.get("suppressed"):
              print("commentary: suppressed —", "; ".join(cm.get("reasons") or []))
          elif cm.get("withheld"):
              print("commentary: partial — withheld:",
                    "; ".join(w["title"] for w in cm["withheld"]))
          else:
              print("commentary: published")
          PY

      - name: Stage site
        run: |
          mkdir -p _site
          cp bond_yield_monitor.html _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # The page deploys either way — curves are worth publishing without prose. But
  # a wholly withheld read must not pass as a green run, or nobody finds out the
  # page has gone wordless.
  alert:
    needs: [build, deploy]
    if: always() && needs.build.outputs.commentary == 'suppressed'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error title=Commentary withheld::Page deployed without the written read — it did not reconcile against the data. See the 'Write and reconcile commentary' step for the reasons."
          exit 1
