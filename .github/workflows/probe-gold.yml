# TEMPORARY: runs the gold fetch from a GitHub runner. Remove before merge.
name: Probe gold sources
on:
  push:
    branches: [claude/determined-galileo-3d04cu]
    paths: [.github/workflows/probe-gold.yml, fetch_rates.py]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: |
          python3 - <<'PY'
          import fetch_rates as f, write_commentary as w
          rows, src = f.fetch_gold()
          d = sorted(rows)
          print(src, len(d), d[0], d[-1], [rows[x] for x in d[-5:]])
          ctx = {"gold": {**f.GOLD_SOURCES[src], "dates": d, "tenors": ["USD"],
                          "series": {"USD": [rows[x]["USD"] for x in d]}}}
          print(w.write_gold(w.Curve({"markets": [], "context": ctx})))
          PY
